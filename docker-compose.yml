services:
  postgres:
    image: postgres:17-bullseye
    container_name: postgres_db
    environment:
      POSTGRES_USER: kiri
      POSTGRES_PASSWORD: kiri123
      POSTGRES_DB: kiri_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiri -d kiri_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
